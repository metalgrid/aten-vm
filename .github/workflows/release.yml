name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TARGET: x86_64-unknown-linux-musl

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release

      - name: Build (static)
        run: cargo build --release --target ${{ env.TARGET }}

      - name: Package
        run: |
          mkdir -p dist
          cp "target/${TARGET}/release/aten-vm" dist/
          strip dist/aten-vm
          tar -czf "dist/aten-vm-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C dist aten-vm
          sha256sum "dist/aten-vm-${GITHUB_REF_NAME}-linux-amd64.tar.gz" \
            > "dist/aten-vm-${GITHUB_REF_NAME}-linux-amd64.tar.gz.sha256"

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
